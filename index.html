<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أوغسطين - نظام الحضور والنقاط</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div id="app">
    <!-- Pages are rendered by JS -->
    <div id="page-login" class="page"></div>
    <div id="page-leader" class="page hidden"></div>
    <div id="page-participant" class="page hidden"></div>
    <div id="page-scan" class="page hidden"></div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <div id="modal-content"></div>
      <button id="modal-close" onclick="closeModal()">✕</button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/login.js"></script>
  <script src="/js/pages/leader.js"></script>
  <script src="/js/pages/participant.js"></script>
  <script src="/js/pages/scan.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
